name: Docs

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          # The newest uv whose checksum this setup-uv release bundles; Dependabot moves it with the action.
          version: "latest-known"

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync --locked --group docs

      - name: Build docs
        run: uv run sphinx-build --builder dirhtml --nitpicky docs site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./site

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
