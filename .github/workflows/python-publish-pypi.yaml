name: Publish Python 🐍 distributions 📦 to PyPI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          # The newest uv whose checksum this setup-uv release bundles; Dependabot moves it with the action.
          version: "latest-known"

      - name: Build Python 🐍 package 📦
        run: uvx --from build pyproject-build --installer uv

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs: build
    if: ${{ github.event.action == 'published' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/idi-zendesk-sdk/${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: false
          # The newest uv whose checksum this setup-uv release bundles; Dependabot moves it with the action.
          version: "latest-known"

      - name: Build Python 🐍 package 📦
        run: uvx --from build pyproject-build --installer uv

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          print-hash: true
