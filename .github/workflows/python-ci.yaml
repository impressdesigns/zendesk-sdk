name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync --group dev --group tests

      - name: Run prek
        run: uv run prek run --all-files

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run Ruff checks
        run: uv run ruff check --output-format=github .

      - name: Run mypy
        run: uv run mypy --strict src/ tests/

      - name: Run ty
        run: uv run ty check --output-format=github .

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"

      - name: Sync dependencies
        run: uv sync --group dev --group tests

      - name: Run tests
        run: uv run python -m coverage run -m pytest -v --junitxml=junit.xml

      - name: Create coverage report
        if: always()
        run: uv run coverage xml

      # junit.xml has no upload destination -- GitHub's native coverage feature reads
      # Cobertura only. It rides along in the artifact so a failed run leaves a
      # machine-readable record behind the logs.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |-
            coverage.xml
            junit.xml
          if-no-files-found: error

  # Split out from `test` so that `code-quality: write` is only ever held by a job that
  # unzips an artifact -- it never executes repository or dependency code.
  upload-coverage-github:
    name: Upload coverage report to GitHub
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage-files

      # A fork pull request's GITHUB_TOKEN is read-only, so the upload would hard-fail
      # rather than no-op. Dependabot's pull_request runs are documented as read-only by
      # default too, and nearly all traffic here is Dependabot -- so skip both rather
      # than risk reddening every bump. A dependency bump does not move coverage, so
      # there is nothing to lose either way.
      - name: Upload coverage report
        if: >-
          github.event_name != 'pull_request'
          || (github.event.pull_request.head.repo.full_name == github.repository
              && github.event.pull_request.user.login != 'dependabot[bot]')
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1.4.1
        with:
          file: coverage-files/coverage.xml
          language: Python
          label: code-coverage/pytest
